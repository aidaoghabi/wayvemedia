<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @font-face { font-family: 'Sora'; src: url('assets/fonts/sora-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Sora'; src: url('assets/fonts/sora-600.woff2') format('woff2'); font-weight: 600; font-display: swap; }
    @font-face { font-family: 'Inter'; src: url('assets/fonts/inter-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Inter'; src: url('assets/fonts/inter-500.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'Inter'; src: url('assets/fonts/inter-600.woff2') format('woff2'); font-weight: 600; font-display: swap; }
    body { margin: 0; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: #8F8FFC; }
  </style>
</helmet>
<div style="position: sticky; top: 0; z-index: 100; font-family: Inter, sans-serif;" onMouseLeave="{{ closeMenu }}">
  <div style="background: rgba(10,10,18,0.82); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.08);">
    <div style="max-width: 1320px; margin: 0 auto; padding: 0 32px; height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 32px;">
      <a href="Home.dc.html" style="display: flex; align-items: center; gap: 12px; flex-shrink: 0;">
        <img src="assets/logo-mark.svg" alt="Wayve Media Agency" style="height: 28px; display: block;">
        <span style="display: flex; flex-direction: column; gap: 1px;">
          <span style="font-family: Sora, sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.04em; color: #ffffff; line-height: 1;">WAYVE</span>
          <span style="font-family: Inter, sans-serif; font-size: 8px; font-weight: 600; letter-spacing: 0.34em; color: rgba(255,255,255,0.55); line-height: 1;">MEDIA AGENCY</span>
        </span>
      </a>
      <nav style="display: flex; align-items: center; gap: 36px; font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.85);">
        <a href="Services.dc.html" onMouseEnter="{{ openMenu }}" style="display: flex; align-items: center; gap: 6px; padding: 26px 0;" style-hover="color: #ffffff;">Services
          <svg width="10" height="6" viewBox="0 0 10 6" fill="none" style="opacity: 0.6;"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
        </a>
        <a href="About.dc.html" onMouseEnter="{{ closeMenu }}" style-hover="color: #ffffff;">About</a>
        <a href="Blogs.dc.html" onMouseEnter="{{ closeMenu }}" style-hover="color: #ffffff;">Insights</a>
      </nav>
      <div style="display: flex; align-items: center; gap: 12px; flex-shrink: 0;">
        <a href="Contact.dc.html" style="padding: 10px 18px; border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; font-size: 14px; font-weight: 600; color: #ffffff;" style-hover="border-color: rgba(255,255,255,0.6);">Contact</a>
        <a href="Contact.dc.html" style="padding: 10px 18px; background: #605FFC; border-radius: 6px; font-size: 14px; font-weight: 600; color: #ffffff;" style-hover="background: #4C4CC9; color: #ffffff;">Book Intro Call</a>
      </div>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; top: 72px; background: rgba(12,12,22,0.97); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); animation: navReveal 0.25s ease;">
      <div style="max-width: 1320px; margin: 0 auto; padding: 40px 32px 44px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px;">
        <sc-for list="{{ pillars }}" as="p" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 14px;">
            <a href="{{ p.href }}" style="font-family: Sora, sans-serif; font-size: 16px; font-weight: 700; color: #ffffff; display: flex; align-items: baseline; gap: 8px;" style-hover="color: #8F8FFC;">
              <span style="font-size: 11px; color: #605FFC; font-family: Inter, sans-serif; font-weight: 600;">{{ p.num }}</span>{{ p.name }}
            </a>
            <div style="display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: rgba(255,255,255,0.6);">
              <a href="{{ p.href }}" style-hover="color: #ffffff;">{{ p.sub1 }}</a>
              <a href="{{ p.href }}" style-hover="color: #ffffff;">{{ p.sub2 }}</a>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="border-top: 1px solid rgba(255,255,255,0.08);">
        <div style="max-width: 1320px; margin: 0 auto; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: rgba(255,255,255,0.5);">
          <span>Four disciplines. One growth system.</span>
          <a href="Services.dc.html" style="color: #8F8FFC; font-weight: 600;" style-hover="color: #ffffff;">All services →</a>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;480px&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false };
  renderVals() {
    return {
      menuOpen: this.state.menuOpen,
      openMenu: () => this.setState({ menuOpen: true }),
      closeMenu: () => this.setState({ menuOpen: false }),
      pillars: [
        { num: "01", name: "Performance Marketing", href: "Performance-Marketing.dc.html", sub1: "Paid Search", sub2: "Paid Social" },
        { num: "02", name: "Organic Growth", href: "Organic-Growth.dc.html", sub1: "Search Engine Optimization", sub2: "Generative Engine Optimization" },
        { num: "03", name: "Development", href: "Development.dc.html", sub1: "Web Development", sub2: "App Development" },
        { num: "04", name: "Consulting", href: "Consulting.dc.html", sub1: "Digital Maturity", sub2: "Business Consulting" }
      ]
    };
  }
}
</script>
</body>
</html>
